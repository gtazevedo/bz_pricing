name: Sync docs to GitHub Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Wiki pages from docs/
        run: |
          mkdir -p wiki_stage
          cp docs/*.md wiki_stage/
          if [ -f wiki_stage/README.md ]; then
            mv wiki_stage/README.md wiki_stage/Home.md
          fi
          for f in wiki_stage/*.md; do
            sed -i "s|\.\./src/|https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/src/|g" "$f"
            sed -i "s|(metodologia_curvas\.md)|(metodologia_curvas)|g" "$f"
            sed -i "s|(guia_uso_api\.md)|(guia_uso_api)|g" "$f"
            sed -i "s|(calendarios_convencoes\.md)|(calendarios_convencoes)|g" "$f"
            sed -i "s|(README\.md)|(Home)|g" "$f"
          done

      - name: Push to GitHub Wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki_repo
          cp wiki_stage/*.md wiki_repo/
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "docs: sync docs/ to GitHub Wiki" && git push)
